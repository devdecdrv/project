version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    ports:
      - "5432:5432"

  scraper:
    build: ./scraper
    restart: "no"
    env_file: .env
    depends_on:
      - db
    # Run manually: docker-compose run --rm scraper python main.py --batch-id <id>

  api:
    build: ./api
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"

  proxy:
    build: ./proxy
    restart: unless-stopped
    env_file: .env
    ports:
      - "8001:8001"

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000
      - VITE_PROXY_URL=http://localhost:8001
    ports:
      - "5173:80"
    depends_on:
      - api
      - proxy

volumes:
  pgdata:
